name: Deploy site (avec prérendu)

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Si Firebase est injoignable, on déploie quand même ton code
      - name: Prérendu Firebase
        continue-on-error: true
        run: node prerender.mjs index.html

      - name: Préparer le site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='functions' --exclude='_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
