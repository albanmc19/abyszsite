name: Prerender Firebase

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le dépôt
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
      - name: Écrire le contenu Firebase dans index.html
        working-directory: site
        run: node prerender.mjs index.html
      - name: Publier si le contenu a changé
        working-directory: site
        run: |
          if git diff --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "prerender-bot"
          git config user.email "prerender-bot@users.noreply.github.com"
          git commit -am "Prérendu automatique du contenu Firebase"
          git push
