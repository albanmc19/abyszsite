<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - ABYSZ Esports</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% -20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h2, h3 {
            font-family: 'Orbitron', sans-serif;
            color: white;
            margin-top: 0;
        }

        /* ── SECTION COMPTEUR TEMPS RÉEL ── */
        .live-counter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .counter-card {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-left: 4px solid #22c55e;
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }

        .counter-card span {
            display: block;
            color: #888;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .counter-card strong {
            display: block;
            font-size: 2.2rem;
            color: white;
            margin-top: 5px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #22c55e;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            margin-top: 5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* ── TABLEAU JOUEURS ── */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }

        .admin-table th {
            background: #0a0a0a;
            color: #a855f7;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 12px;
            border-bottom: 2px solid #2a2a2a;
            text-transform: uppercase;
        }

        .admin-table td {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.9rem;
        }

        .badge-space {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .btn {
            background: #a855f7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #b975ff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .btn-danger {
            background: #ff4444 !important;
        }

        .btn-danger:hover {
            background: #ff6666 !important;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
        }

        /* ── MODAL ÉDITION ── */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup {
            background: #141414;
            border: 2px solid #a855f7;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #777;
            cursor: pointer;
            transition: color 0.2s;
        }

        .popup-close:hover {
            color: #ff4444;
        }

        .popup-avatar-img {
            width: 100%;
            max-height: 140px;
            object-fit: contain;
            border: 2px solid #a855f7;
            border-radius: 12px;
            margin: 0 auto 15px auto;
            display: block;
            background: #0a0a0a;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #a855f7;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .file-upload-btn {
            display: block;
            text-align: center;
            background: #1a1a1a;
            border: 1px dashed #a855f7;
            color: #ccc;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .file-upload-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            color: #fff;
        }

        .btn-remove-img {
            background: #331c1c;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-remove-img:hover {
            background: #ff4444;
            color: #fff;
        }

        .hidden { display: none !important; }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; connect-src https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com; img-src 'self' data: blob:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>

    <nav>
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
                <img src="logo.png" alt="Logo ABYSZ" style="height:30px;">
                ABYSZ DASHBOARD
            </a>
        </div>
        <ul>
            <li><a href="index.html">Voir le site</a></li>
            <li><a href="roster.html">Roster</a></li>
            <li><button id="admin-logout-btn" style="background:none; border:1px solid #ff4444; color:#ff4444; padding:6px 12px; border-radius:12px; cursor:pointer; font-family:'Orbitron';">Déconnexion</button></li>
        </ul>
    </nav>

    <div class="dashboard-container">
        <h2>Tableau de Bord Administrateur</h2>

        <!-- SECTION COMPTEUR TEMPS RÉEL -->
        <div class="live-counter-grid">
            <div class="counter-card">
                <span>Joueurs / Visiteurs En Ligne</span>
                <strong id="live-online-count">0</strong>
                <div class="live-badge">
                    <span class="pulse-dot"></span> EN DIRECT
                </div>
            </div>
            <div class="counter-card" style="border-left-color: #a855f7;">
                <span>Total Joueurs Roster</span>
                <strong id="total-roster-count">0</strong>
                <span style="font-size:0.75rem; color:#aaa; margin-top:5px; display:block;">Inscrits dans la base</span>
            </div>
        </div>

        <!-- SECTION ROSTER / ÉDITION DES JOUEURS -->
        <div class="card">
            <h3>🎮 Gestion des Joueurs (Roster)</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Pseudo</th>
                        <th>Espace / Équipe</th>
                        <th>Rôle</th>
                        <th>Earnings</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dashboard-roster-tbody">
                    <tr><td colspan="5" style="text-align:center; color:#666;">Chargement des joueurs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- POP-UP OVERLAY : ÉDITION DU JOUEUR -->
    <div id="edit-player-modal-overlay" class="popup-overlay">
        <div class="popup">
            <span class="popup-close" id="close-edit-player-modal">&times;</span>
            <h3 style="font-family:'Orbitron', sans-serif; color:#a855f7; text-align:center; margin-bottom:15px;" id="modal-title">Modifier le profil</h3>
            
            <img src="logo.png" id="edit-preview-img" class="popup-avatar-img">

            <form id="edit-player-form" onsubmit="return false;">
                <div class="input-group">
                    <label>Photo du joueur</label>
                    <label for="edit-file-input" class="file-upload-btn">📁 Choisir une image</label>
                    <input type="file" id="edit-file-input" accept="image/*" class="hidden">
                    <div style="margin-top: 5px;">
                        <button type="button" class="btn-remove-img" id="btn-clear-img">🗑️ Réinitialiser au logo</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Pseudo</label>
                    <input type="text" id="edit-pseudo" required>
                </div>

                <!-- MODIFICATION DE L'ESPACE / ÉQUIPE DU JOUEUR -->
                <div class="input-group">
                    <label>Espace / Équipe assignée</label>
                    <select id="edit-space">
                        <option value="main">🔥 Équipe Principale (Pro)</option>
                        <option value="academy">⚡ Équipe Académie</option>
                        <option value="cdf">🌱 Centre de Formation (CDF)</option>
                        <option value="staff">🛡️ Staff / Management</option>
                        <option value="sub">🔄 Remplaçant / Sub</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Rôle / Poste</label>
                    <input type="text" id="edit-role" placeholder="Ex: Capitaine, Sniper, Entry..." required>
                </div>

                <div class="input-group">
                    <label>Earnings</label>
                    <input type="text" id="edit-earnings" placeholder="Ex: 500 €">
                </div>

                <div class="input-group" style="border-top: 1px solid #222; padding-top:15px; margin-top:15px;">
                    <label style="color:#fff;">🔗 Liens Réseaux Sociaux</label>
                    <input type="url" id="edit-twitter" placeholder="Lien Twitter / X" style="margin-bottom:8px;">
                    <input type="url" id="edit-twitch" placeholder="Lien Twitch" style="margin-bottom:8px;">
                    <input type="url" id="edit-youtube" placeholder="Lien YouTube" style="margin-bottom:8px;">
                    <input type="url" id="edit-tiktok" placeholder="Lien TikTok">
                </div>

                <button type="submit" class="btn" style="width:100%; margin-top:20px;">💾 Sauvegarder les modifications</button>
                <button type="button" class="btn btn-danger" id="btn-delete-player" style="width:100%; margin-top:8px;">🗑️ Supprimer le joueur</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFzPc8WF4IGN74RZ1axtpUBu6Bv8Iu-UQ",
            authDomain: "abysz-esports.firebaseapp.com",
            projectId: "abysz-esports",
            storageBucket: "abysz-esports.firebasestorage.app",
            messagingSenderId: "200968659347",
            appId: "1:200968659347:web:3a13d1614d00ed29968866"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "abyszofficial@gmail.com";

        let currentEditingPlayerId = null;
        let currentImageBase64 = "logo.png";

        const modalOverlay = document.getElementById("edit-player-modal-overlay");
        const closeModalBtn = document.getElementById("close-edit-player-modal");
        const fileInput = document.getElementById("edit-file-input");
        const previewImg = document.getElementById("edit-preview-img");
        const btnClearImg = document.getElementById("btn-clear-img");
        const editForm = document.getElementById("edit-player-form");
        const btnDeletePlayer = document.getElementById("btn-delete-player");

        // Authentification Admin
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase().trim() !== ADMIN_EMAIL) {
                window.location.href = "roster.html";
            } else {
                ecouterCompteurEnTempsReel();
                ecouterRoster();
            }
        });

        document.getElementById("admin-logout-btn").addEventListener("click", () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });

        // 1. ÉCOUTE DU COMPTEUR TEMPS RÉEL (FIRESTORE)
        function ecouterCompteurEnTempsReel() {
            onSnapshot(doc(db, "analytics", "online"), (docSnap) => {
                if (docSnap.exists()) {
                    document.getElementById("live-online-count").textContent = docSnap.data().count || 0;
                } else {
                    document.getElementById("live-online-count").textContent = 0;
                }
            }, (error) => {
                console.warn("Écoute temps réel :", error);
            });
        }

        // 2. ÉCOUTE DE LA LISTE DES JOUEURS ET AFFICHAGE DES ESPACES
        function ecouterRoster() {
            const q = query(collection(db, "roster"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById("dashboard-roster-tbody");
                tbody.innerHTML = "";

                document.getElementById("total-roster-count").textContent = snapshot.size;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#666;">Aucun joueur dans le roster.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const player = { id: docSnap.id, ...docSnap.data() };
                    const spaceLabel = player.space || player.team || 'main';
                    
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td style="font-weight:bold; color:#fff;">${player.pseudo || 'Inconnu'}</td>
                        <td><span class="badge-space">${spaceLabel}</span></td>
                        <td>${player.role || '-'}</td>
                        <td style="color:#22c55e;">${player.earnings || '0 €'}</td>
                        <td>
                            <button class="btn btn-manage">Gérer</button>
                        </td>
                    `;

                    tr.querySelector(".btn-manage").addEventListener("click", () => {
                        openEditPlayerModal(player);
                    });

                    tbody.appendChild(tr);
                });
            });
        }

        // Modal Handlers
        closeModalBtn.addEventListener("click", () => modalOverlay.classList.remove("active"));

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageBase64 = event.target.result;
                    previewImg.src = currentImageBase64;
                };
                reader.readAsDataURL(file);
            }
        });

        btnClearImg.addEventListener("click", () => {
            currentImageBase64 = "logo.png";
            previewImg.src = "logo.png";
        });

        function openEditPlayerModal(player) {
            currentEditingPlayerId = player.id;
            currentImageBase64 = player.image || "logo.png";

            document.getElementById("modal-title").textContent = `Modifier : ${player.pseudo || 'Joueur'}`;
            previewImg.src = currentImageBase64;
            document.getElementById("edit-pseudo").value = player.pseudo || "";
            document.getElementById("edit-space").value = player.space || player.team || "main";
            document.getElementById("edit-role").value = player.role || "";
            document.getElementById("edit-earnings").value = player.earnings || "";
            document.getElementById("edit-twitter").value = player.twitter || "";
            document.getElementById("edit-twitch").value = player.twitch || "";
            document.getElementById("edit-youtube").value = player.youtube || "";
            document.getElementById("edit-tiktok").value = player.tiktok || "";

            modalOverlay.classList.add("active");
        }

        // Enregistrer modifications de l'espace et des infos
        editForm.addEventListener("submit", async () => {
            if (!currentEditingPlayerId) return;

            const selectedSpace = document.getElementById("edit-space").value;

            const updatedData = {
                pseudo: document.getElementById("edit-pseudo").value.trim(),
                space: selectedSpace,
                team: selectedSpace, // Maintient la rétrocompatibilité
                role: document.getElementById("edit-role").value.trim(),
                earnings: document.getElementById("edit-earnings").value.trim(),
                image: currentImageBase64,
                twitter: document.getElementById("edit-twitter").value.trim(),
                twitch: document.getElementById("edit-twitch").value.trim(),
                youtube: document.getElementById("edit-youtube").value.trim(),
                tiktok: document.getElementById("edit-tiktok").value.trim()
            };

            try {
                await setDoc(doc(db, "roster", currentEditingPlayerId), updatedData, { merge: true });
                modalOverlay.classList.remove("active");
            } catch (err) {
                console.error("Erreur de modification :", err);
                alert("Erreur lors de la sauvegarde.");
            }
        });

        // Supprimer joueur
        btnDeletePlayer.addEventListener("click", async () => {
            if (!currentEditingPlayerId) return;
            if (confirm("Voulez-vous vraiment supprimer ce joueur du Roster ?")) {
                try {
                    await deleteDoc(doc(db, "roster", currentEditingPlayerId));
                    modalOverlay.classList.remove("active");
                } catch (err) {
                    console.error("Erreur de suppression :", err);
                    alert("Erreur lors de la suppression.");
                }
            }
        });
    </script>
</body>
</html>
