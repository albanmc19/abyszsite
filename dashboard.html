<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, getDocs, deleteDoc, doc, getDoc, where, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFzPc8WF4IGN74RZ1axtpUBu6Bv8Iu-UQ",
            authDomain: "abysz-esports.firebaseapp.com",
            databaseURL: "https://abysz-esports-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "abysz-esports",
            storageBucket: "abysz-esports.firebasestorage.app",
            messagingSenderId: "200968659347",
            appId: "1:200968659347:web:3a13d1614d00ed29968866"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        const ADMIN_EMAIL = "abyszofficial@gmail.com";

        const accessDeniedSec = document.getElementById('access-denied');
        const dashboardContentSec = document.getElementById('dashboard-content');
        const playersRows = document.getElementById('db-players-rows');
        const countMain = document.getElementById('count-main');
        const countAcademy = document.getElementById('count-academy');
        const countCdf = document.getElementById('count-cdf');

        const liveOnlineNum = document.getElementById('live-online');
        const siteVisitesNum = document.getElementById('site-visites');
        const discordClicksNum = document.getElementById('discord-clicks');
        const boutiqueInterestNum = document.getElementById('boutique-interest');
        const conversionRateNum = document.getElementById('conversion-rate');
        const pageFilter = document.getElementById('page-filter');
        const resetBtn = document.getElementById('reset-analytics-btn');
        const recordPeakNum = document.getElementById('record-peak');
        const recordPeakDateEl = document.getElementById('record-peak-date');
        const graphLiveCountEl = document.getElementById('graph-live-count');

        let activeTargetUid = ""; 
        let activeTargetEmail = "";
        let listeDocsAnalytics = [];

        // HISTORIQUE 30 JOURS & PIC RECORD
        const JOURS_HISTORIQUE = 30;
        let historique30j = Array(JOURS_HISTORIQUE).fill(0);
        let picDuJourCache = 0;
        let picRecordCache = 0;
        let picRecordDateCache = ""; 

        function getDateKey(date = new Date()) {
            return date.toISOString().split('T')[0];
        }

        function getCutoffKey() {
            const d = new Date();
            d.setDate(d.getDate() - (JOURS_HISTORIQUE - 1));
            return getDateKey(d);
        }

        function construireTableau30Jours(docs) {
            const map = {};
            docs.forEach(d => { map[d.date] = d.peak || 0; });

            const tableau = [];
            const today = new Date();
            for (let i = JOURS_HISTORIQUE - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = getDateKey(d);
                tableau.push(map[key] || 0);
            }
            return tableau;
        }

        function chargerHistorique30Jours() {
            const cutoff = getCutoffKey();
            const q = query(collection(db, "traffic_history"), where("date", ">=", cutoff), orderBy("date", "asc"));

            onSnapshot(q, (snapshot) => {
                const docs = [];
                snapshot.forEach(d => docs.push(d.data()));
                historique30j = construireTableau30Jours(docs);

                const todayKey = getDateKey();
                const todayDoc = docs.find(d => d.date === todayKey);
                picDuJourCache = todayDoc ? (todayDoc.peak || 0) : 0;

                dessinerGraphique();
            });
        }

        async function enregistrerPicDuJour(count) {
            if (count <= picDuJourCache) return;
            picDuJourCache = count;
            const todayKey = getDateKey();
            try {
                await setDoc(doc(db, "traffic_history", todayKey), {
                    date: todayKey,
                    peak: count,
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (e) { console.error("Erreur enregistrement historique :", e); }
        }

        async function chargerPicRecord() {
            try {
                const snap = await getDoc(doc(db, "stats", "records"));
                if (snap.exists()) {
                    const data = snap.data();
                    picRecordCache = data.peakOnline || 0;
                    picRecordDateCache = data.peakOnlineDate || "";
                    afficherPicRecord();
                }
            } catch (e) { console.error("Erreur chargement du record :", e); }
        }

        async function mettreAJourPicRecord(count) {
            if (count <= picRecordCache) return;
            picRecordCache = count;
            picRecordDateCache = getDateKey();
            afficherPicRecord();
            try {
                await setDoc(doc(db, "stats", "records"), {
                    peakOnline: count,
                    peakOnlineDate: picRecordDateCache,
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (e) { console.error("Erreur enregistrement du record :", e); }
        }

        function afficherPicRecord() {
            if (recordPeakNum) recordPeakNum.textContent = picRecordCache;
            if (recordPeakDateEl) {
                recordPeakDateEl.textContent = picRecordDateCache ? `Atteint le ${picRecordDateCache}` : "";
            }
        }

        // GRAPHIQUE
        const canvas = document.getElementById('trafficChart');
        const ctx = canvas ? canvas.getContext('2d') : null;

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            dessinerGraphique();
        }
        window.addEventListener('resize', resizeCanvas);

        function dessinerGraphique() {
            if (!ctx || !canvas) return;

            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let y = height / 3; y < height; y += height / 3) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const data = historique30j.length ? historique30j : [0];
            const maxVal = Math.max(...data, 5);
            const stepX = width / (data.length - 1 || 1);

            const greenGradient = ctx.createLinearGradient(0, 0, 0, height);
            greenGradient.addColorStop(0, 'rgba(34, 197, 94, 0.45)');
            greenGradient.addColorStop(1, 'rgba(34, 197, 94, 0.02)');

            ctx.beginPath();
            ctx.moveTo(0, height);
            data.forEach((val, i) => {
                const x = i * stepX;
                const y = height - (val / maxVal) * (height * 0.4) - 10;
                if (i === 0) ctx.lineTo(x, y);
                else {
                    const prevX = (i - 1) * stepX;
                    const prevY = height - (data[i - 1] / maxVal) * (height * 0.4) - 10;
                    const cx = (prevX + x) / 2;
                    ctx.quadraticCurveTo(prevX, prevY, cx, (prevY + y) / 2);
                }
            });
            ctx.lineTo(width, height - (data[data.length - 1] / maxVal) * (height * 0.4) - 10);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = greenGradient;
            ctx.fill();

            ctx.beginPath();
            data.forEach((val, i) => {
                const x = i * stepX;
                const y = height - (val / maxVal) * (height * 0.4) - 10;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.8)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            data.forEach((val, i) => {
                const x = i * stepX;
                const y = height - (val / maxVal) * (height * 0.75) - 35;
                if (i === 0) ctx.moveTo(x, y);
                else {
                    const prevX = (i - 1) * stepX;
                    const prevY = height - (data[i - 1] / maxVal) * (height * 0.75) - 35;
                    const cx = (prevX + x) / 2;
                    ctx.quadraticCurveTo(prevX, prevY, cx, (prevY + y) / 2);
                }
            });
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#eab308';
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        setTimeout(resizeCanvas, 100);

        // AUTHENTIFICATION
        onAuthStateChanged(auth, (user) => {
            if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                accessDeniedSec.classList.add('hidden');
                dashboardContentSec.classList.remove('hidden');
                
                lancerTraqueTempsReel();
                chargerDonneesDashboard();
                ecouterCollectionAnalytics();
                chargerHistorique30Jours();
                chargerPicRecord();
                setupPlayerEditing(); 
                
                if(pageFilter) pageFilter.addEventListener('change', () => calculerEtAfficherStats(pageFilter.value));
                if(resetBtn) setupResetButton();
            } else {
                accessDeniedSec.classList.remove('hidden');
                dashboardContentSec.classList.add('hidden');
            }
        });

        // REALTIME DATABASE ONLINE USERS
        function lancerTraqueTempsReel() {
            const onlineUsersRef = ref(rtdb, "online_users");

            onValue(onlineUsersRef, (snapshot) => {
                let total = 0;
                const val = snapshot.val();

                if (val !== null && val !== undefined) {
                    if (typeof val === 'object') {
                        total = Object.keys(val).length;
                    } else if (typeof val === 'number') {
                        total = val;
                    }
                }

                if (liveOnlineNum) {
                    liveOnlineNum.innerHTML = `<span class="live-indicator"></span>${total}`;
                }
                if (graphLiveCountEl) {
                    graphLiveCountEl.textContent = `${total} connecté(s)`;
                }

                if (historique30j.length) {
                    historique30j[historique30j.length - 1] = Math.max(historique30j[historique30j.length - 1], total);
                    dessinerGraphique();
                }

                enregistrerPicDuJour(total);
                mettreAJourPicRecord(total);
            }, (error) => {
                console.error("Erreur de lecture RTDB online_users :", error);
            });
        }

        function ecouterCollectionAnalytics() {
            onSnapshot(collection(db, "analytics"), (snapshot) => {
                listeDocsAnalytics = [];
                snapshot.forEach((d) => listeDocsAnalytics.push(d.data()));
                calculerEtAfficherStats(pageFilter ? pageFilter.value : "all");
            });
        }

        function calculerEtAfficherStats(filtrePage) {
            let totalVisites = 0; let totalDiscord = 0; let totalBoutique = 0;

            listeDocsAnalytics.forEach((docData) => {
                const pageDuDoc = docData.page || "";
                
                let estDiscord = docData.isDiscordClick === true || docData.clickType === "discord";
                if (estDiscord) { totalDiscord++; return; }
                if (pageDuDoc.includes("boutique")) totalBoutique++;
                
                if (filtrePage !== "all" && !pageDuDoc.includes(filtrePage)) return;
                totalVisites++;
            });

            if(siteVisitesNum) siteVisitesNum.textContent = totalVisites;
            if(discordClicksNum) discordClicksNum.textContent = totalDiscord;
            if(boutiqueInterestNum) boutiqueInterestNum.textContent = totalBoutique;
            if(conversionRateNum) {
                conversionRateNum.textContent = totalVisites > 0 ? `${((totalDiscord / totalVisites) * 100).toFixed(1)}%` : "0%";
            }
        }

        function setupResetButton() {
            resetBtn.onclick = async () => {
                if (confirm("Réinitialiser toutes les statistiques d'analytics ?")) {
                    try {
                        const snap = await getDocs(collection(db, "analytics"));
                        const promises = [];
                        snap.forEach((d) => promises.push(deleteDoc(doc(db, "analytics", d.id))));
                        await Promise.all(promises);
                        alert("Statistiques remises à zéro !");
                    } catch (e) { alert(e.message); }
                }
            };
        }

        function chargerDonneesDashboard() {
            const q = query(collection(db, "roster"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                if(!playersRows) return;
                playersRows.innerHTML = "";
                let mCount = 0, aCount = 0, cCount = 0;
                snapshot.forEach((docSnap) => {
                    const player = docSnap.data();
                    if (player.team === "main") mCount++; 
                    else if (player.team === "academy") aCount++; 
                    else if (player.team === "cdf") cCount++;
                    
                    const tr = document.createElement('tr');
                    const cols = [
                        player.pseudo || 'Inconnu',
                        player.team || '-',
                        player.role || '-',
                        player.earnings || '0'
                    ];
                    cols.forEach(val => {
                        const td = document.createElement('td');
                        td.textContent = val;
                        tr.appendChild(td);
                    });
                    const tdAction = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.textContent = 'Gérer';
                    const emailSafe = player.email || '';
                    btn.addEventListener('click', () => {
                        const emailInput = document.getElementById('search-player-email');
                        if (emailInput) { emailInput.value = emailSafe; }
                        const searchBtn = document.getElementById('btn-search-player');
                        if (searchBtn) searchBtn.click();
                    });
                    tdAction.appendChild(btn);
                    tr.appendChild(tdAction);
                    playersRows.appendChild(tr);
                });
                if(countMain) countMain.textContent = mCount; 
                if(countAcademy) countAcademy.textContent = aCount; 
                if(countCdf) countCdf.textContent = cCount;
            });
        }

        // GESTION RECHERCHE & ÉDITION JOUEURS
        function setupPlayerEditing() {
            const searchInput = document.getElementById('search-player-email');
            const searchBtn = document.getElementById('btn-search-player');
            const searchErr = document.getElementById('search-error');
            const editFormContainer = document.getElementById('player-edit-form-container');
            const modifyForm = document.getElementById('dashboard-player-modify-form');
            const successMsg = document.getElementById('save-success');

            if (!searchBtn) return;

            searchBtn.onclick = async () => {
                if (searchErr) searchErr.classList.add('hidden');
                if (editFormContainer) editFormContainer.classList.add('hidden');
                if (successMsg) successMsg.classList.add('hidden');

                const emailRecherche = searchInput ? searchInput.value.trim().toLowerCase() : "";
                if (!emailRecherche) return;

                try {
                    const q = query(collection(db, "players"), where("email", "==", emailRecherche));
                    const snapshot = await getDocs(q);

                    if (!snapshot.empty) {
                        const targetDoc = snapshot.docs[0];
                        activeTargetUid = targetDoc.id; 
                        activeTargetEmail = emailRecherche;

                        const data = targetDoc.data();
                        document.getElementById('player-pseudo-input').value = data.pseudo || "";
                        document.getElementById('player-roster-input').value = data.roster || "";
                        document.getElementById('player-role-input').value = data.role || "";
                        document.getElementById('player-rank-input').value = data.rank || "";
                        document.getElementById('player-date-input').value = data.joinDate || "";
                        document.getElementById('player-doc-input').value = data.documentUrl || "";
                        document.getElementById('player-msg-input').value = data.staffMessage || "";

                        if (editFormContainer) editFormContainer.classList.remove('hidden');
                    } else {
                        if (searchErr) {
                            searchErr.textContent = "Aucun joueur trouvé avec cet e-mail. Demandez-lui de se connecter au moins une fois à son espace.";
                            searchErr.classList.remove('hidden');
                        }
                    }
                } catch (err) { console.error("Erreur recherche joueur:", err); }
            };

            if (modifyForm) {
                modifyForm.onsubmit = async (e) => {
                    e.preventDefault();
                    
                    if (successMsg) successMsg.classList.add('hidden');
                    const emailRecherche = searchInput ? searchInput.value.trim().toLowerCase() : "";
                    if (!emailRecherche) return;

                    const btnSave = document.getElementById('btn-save-player');
                    if (btnSave) {
                        btnSave.disabled = true;
                        btnSave.textContent = "Enregistrement...";
                    }

                    try {
                        const q = query(collection(db, "players"), where("email", "==", emailRecherche));
                        const snapshot = await getDocs(q);

                        if (!snapshot.empty) {
                            const trueDocId = snapshot.docs[0].id;
                            const playerDocRef = doc(db, "players", trueDocId);

                            const dataMiseAJour = {
                                pseudo: document.getElementById('player-pseudo-input').value.trim(),
                                roster: document.getElementById('player-roster-input').value.trim(),
                                role: document.getElementById('player-role-input').value.trim(),
                                rank: document.getElementById('player-rank-input').value.trim(),
                                joinDate: document.getElementById('player-date-input').value.trim(),
                                documentUrl: document.getElementById('player-doc-input').value.trim(), 
                                staffMessage: document.getElementById('player-msg-input').value.trim()
                            };

                            await setDoc(playerDocRef, dataMiseAJour, { merge: true });
                            if (successMsg) successMsg.classList.remove('hidden');
                        } else {
                            alert("Erreur : Impossible de localiser le compte de ce joueur dans Firestore.");
                        }
                    } catch (error) {
                        console.error("Erreur de sauvegarde :", error);
                        alert("Erreur lors de l'enregistrement : " + error.message);
                    } finally {
                        if (btnSave) {
                            btnSave.disabled = false;
                            btnSave.textContent = "Enregistrer les modifications";
                        }
                    }
                };
            }
        }
    </script>
