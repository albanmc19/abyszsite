<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABYSZ - Accueil</title>
  <style>
    /* Style de base */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }

    /* Section À la une */
    .featured-section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background-color: #1e1e1e;
      border-radius: 8px;
    }

    .featured-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .featured-container {
        flex-direction: row;
        align-items: center;
      }
    }

    /* Conteneur de l'image à la une */
    .featured-image-wrapper {
      position: relative;
      flex: 1;
      cursor: pointer;
      overflow: hidden;
      border-radius: 8px;
    }

    .featured-image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .featured-image-wrapper:hover img {
      transform: scale(1.03);
    }

    /* Indicateur au survol */
    .featured-image-wrapper::after {
      content: "🔍 Clic pour agrandir";
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .featured-image-wrapper:hover::after {
      opacity: 1;
    }

    .featured-content {
      flex: 1;
    }

    /* Style du Lightbox (Focus plein écran) */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .image-modal.active {
      display: flex;
      opacity: 1;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .image-modal.active img {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #ffffff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .modal-close:hover {
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- Section À la une -->
  <section class="featured-section">
    <h2>À la une</h2>
    <div class="featured-container">
      <div class="featured-image-wrapper" id="featuredWrapper">
        <img id="featuredImg" src="https://via.placeholder.com/600x350" alt="ABYSZ Événement à la une">
      </div>
      <div class="featured-content">
        <h3>Bienvenue chez ABYSZ</h3>
        <p>Découvrez nos dernières actualités, nos compétitions esport en cours et les moments forts de l'organisation.</p>
      </div>
    </div>
  </section>

  <!-- Modale / Lightbox pour l'image en focus -->
  <div class="image-modal" id="imageModal" aria-hidden="true">
    <span class="modal-close" id="modalClose">&times;</span>
    <img id="modalImg" src="" alt="Focus sur l'image à la une">
  </div>

  <script>
    const featuredWrapper = document.getElementById('featuredWrapper');
    const featuredImg = document.getElementById('featuredImg');
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalClose = document.getElementById('modalClose');

    // Ouvrir le focus au clic sur l'image
    featuredWrapper.addEventListener('click', () => {
      modalImg.src = featuredImg.src;
      modalImg.alt = featuredImg.alt;
      imageModal.classList.add('active');
      imageModal.setAttribute('aria-hidden', 'false');
    });

    // Fermer avec la croix
    modalClose.addEventListener('click', closeModal);

    // Fermer en cliquant à l'extérieur de l'image
    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) {
        closeModal();
      }
    });

    // Fermer avec la touche Échap
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && imageModal.classList.contains('active')) {
        closeModal();
      }
    });

    function closeModal() {
      imageModal.classList.remove('active');
      imageModal.setAttribute('aria-hidden', 'true');
    }
  </script>

</body>
</html>
