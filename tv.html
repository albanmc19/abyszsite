<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABYSZ TV — En Direct</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; color: #a855f7; margin-bottom: 5px; }
        .tv-container { max-width: 900px; margin: 20px auto; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.15); }
        
        /* Status Badge */
        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; padding: 6px 16px; border-radius: 20px; margin-bottom: 15px; }
        .status-badge.online { background: rgba(239, 68, 68, 0.2); color: #ff4444; border: 1px solid #ff4444; }
        .status-badge.offline { background: rgba(255, 255, 255, 0.05); color: #888; border: 1px solid #333; }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; box-shadow: 0 0 10px #ff4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* Embed Frame */
        .player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 1px solid #2a2a2a; background: #000; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .offline-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d0d0d; color: #aaa; font-family: 'Orbitron', sans-serif; }
        
        /* Multistream Cards */
        .platforms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 25px; }
        .platform-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 15px; border-radius: 12px; text-decoration: none; color: white; transition: transform 0.2s, border-color 0.2s; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; }
        .platform-card:hover { transform: translateY(-3px); border-color: #a855f7; }
        .twitch { border-top: 3px solid #9146FF; }
        .youtube { border-top: 3px solid #FF0000; }
        .tiktok { border-top: 3px solid #00F2FE; }
    </style>
</head>
<body>

    <h1>📺 ABYSZ TV</h1>
    <p style="color:#aaa; font-size:0.9rem;">Suivez nos diffusions en direct sur toutes nos plateformes</p>

    <div class="tv-container">
        <!-- Statut Dynamique -->
        <div id="live-status" class="status-badge offline">
            <span id="status-text">VERIFICATION DU LIVE...</span>
        </div>

        <!-- Lecteur Twitch / Offline -->
        <div class="player-wrapper">
            <div id="offline-screen" class="offline-placeholder">
                <span style="font-size: 2rem; margin-bottom: 10px;">📡</span>
                <p>LA CHAÎNE EST ACTUELLEMENT HORS LIGNE</p>
                <span style="font-size:0.75rem; color:#666;">Abonnez-vous sur nos réseaux pour ne pas rater le prochain stream !</span>
            </div>
            <iframe 
                id="twitch-player"
                src=""
                allowfullscreen="true">
            </iframe>
        </div>

        <!-- Liens rapides vers les 3 chaînes inspectées -->
        <div class="platforms-grid">
            <a href="https://www.twitch.tv/abysz_o" target="_blank" class="platform-card twitch">
                💜 Twitch <br><span style="font-size:0.7rem; color:#888;">@abysz_o</span>
            </a>
            <a href="https://www.youtube.com/@Abysz_o" target="_blank" class="platform-card youtube">
                🔴 YouTube <br><span style="font-size:0.7rem; color:#888;">@Abysz_o</span>
            </a>
            <a href="https://www.tiktok.com/@abysz_o" target="_blank" class="platform-card tiktok">
                🎵 TikTok <br><span style="font-size:0.7rem; color:#888;">@abysz_o</span>
            </a>
        </div>
    </div>

    <script>
        const TWITCH_CHANNEL = "abysz_o";
        // Détecte le nom de domaine actuel pour autoriser l'embed Twitch
        const currentDomain = window.location.hostname || "localhost";

        const playerIframe = document.getElementById("twitch-player");
        const offlineScreen = document.getElementById("offline-screen");
        const statusBadge = document.getElementById("live-status");
        const statusText = document.getElementById("status-text");

        // Configuration de l'URL du lecteur Twitch
        playerIframe.src = `https://player.twitch.tv/?channel=${TWITCH_CHANNEL}&parent=${currentDomain}&autoplay=false`;

        // Verification du statut du stream via l'API publique de statut Twitch
        async function checkTwitchLiveStatus() {
            try {
                // Utilisation du service de verification de live
                const response = await fetch(`https://decapi.me/twitch/uptime/${TWITCH_CHANNEL}`);
                const uptimeText = await response.text();

                if (uptimeText.includes("offline") || uptimeText.includes("not found")) {
                    // HORS LIGNE
                    statusBadge.className = "status-badge offline";
                    statusText.textContent = "● HORS LIGNE";
                    offlineScreen.style.display = "flex";
                } else {
                    // EN DIRECT !
                    statusBadge.className = "status-badge online";
                    statusBadge.innerHTML = `<span class="pulse-dot"></span> EN DIRECT SUR TWITCH (${uptimeText})`;
                    offlineScreen.style.display = "none";
                }
            } catch (err) {
                console.error("Erreur verification live:", err);
                statusText.textContent = "TWITCH @ABYSZ_O";
            }
        }

        // Exécution au chargement + rafraîchissement toutes les 60 secondes
        checkTwitchLiveStatus();
        setInterval(checkTwitchLiveStatus, 60000);
    </script>
</body>
</html>
