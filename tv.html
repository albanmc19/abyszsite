*{box-sizing:border-box;margin:0;padding:0}

.th{position:relative;aspect-ratio:16/9;background:radial-gradient(circle,#1a1a26,#0d0d14);display:flex;align-items:center;justify-content:center}

.pl{position:relative;width:50px;height:50px;border-radius:50%;background:rgba(168,85,247,.92);border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(168,85,247,.8);transition:.3s}

.vi{padding:14px 16px}
.vt{font:700 .68rem Orbitron,sans-serif;color:var(--p);letter-spacing:1px}

.warn{color:#f59e0b;font-size:.75rem;margin-top:6px}

.fg input:focus,.fg select:focus{border-color:var(--p);outline:0}
.row{display:flex;gap:10px;margin-top:18px}.row .btn{flex:1;justify-content:center}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ph b{font:700 1rem Orbitron,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph div{display:flex;gap:8px;align-items:center}
#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--c);padding:13px 20px;border-radius:10px;font-size:.85rem;border-left:4px solid var(--p);box-shadow:0 10px 25px rgba(0,0,0,.6)}
.toast.success{border-color:#10b981}.toast.error{border-color:var(--r)}
footer{padding:28px;text-align:center;border-top:1px solid #151520;color:#666680;font:.8rem Orbitron,sans-serif;margin-top:50px}
@media(max-width:640px){.card.big{grid-column:auto}h1{font-size:1.8rem}nav{padding:12px 16px}}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,setPersistence,browserSessionPersistence,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

if(top!==self){document.documentElement.textContent="";throw new Error("frame")}
const ADMIN="abyszofficial@gmail.com",HOST=location.hostname||"localhost";
const app=initializeApp({apiKey:"AIzaSyBFzPc8WF4IGN74RZ1axtpUBu6Bv8Iu-UQ",authDomain:"abyszofficial.firebaseapp.com",projectId:"abyszofficial",storageBucket:"abyszofficial.appspot.com",messagingSenderId:"1023849201948",appId:"1:1023849201948:web:abcdef123456789"});
const auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserSessionPersistence).catch(()=>{});

const S={ch:[{platform:"twitch",id:"abysz_o",name:"Twitch"},{platform:"tiktok",id:"abysz_o",name:"TikTok"}],vid:[],live:{},sel:0,manual:false,tag:"TOUT",key:"",edit:-1};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const isAdmin=()=>auth.currentUser?.email===ADMIN;
const ICON={twitch:"💜",youtube:"🔴",kick:"🟢",tiktok:"🎵",link:"⚡"};
const open=id=>$("#"+id).classList.add("on"),close=id=>$("#"+id).classList.remove("on");
$("#logo-img").addEventListener("error",e=>e.target.hidden=true);

function toast(m,t=""){const e=el("div","toast "+t,m);$("#toasts").append(e);setTimeout(()=>e.remove(),3500)}
const clean=(s,n)=>String(s??"").replace(/[\u0000-\u001f<>]/g,"").trim().slice(0,n);
const safeUrl=s=>{try{const u=new URL(s);return u.protocol==="https:"?u.href:null}catch{return null}};

const RX={twitch:/^[A-Za-z0-9_]{3,25}$/,youtube:/^UC[\w-]{22}$/,kick:/^[A-Za-z0-9_-]{3,25}$/,tiktok:/^[A-Za-z0-9_.]{2,30}$/};
function cleanCh(c){if(!c)return null;const p=c.platform,name=clean(c.name,40);
  if(p==="link"){const url=safeUrl(c.url);return url&&name?{platform:p,name,url}:null}
  const id=clean(c.id,40);return RX[p]?.test(id)?{platform:p,id,name:name||p.toUpperCase()}:null}
const cleanVid=v=>({title:clean(v?.title,120),tag:clean(v?.tag,24).toUpperCase()||"OFFICIEL",url:clean(v?.url,300)});

function parseVideo(raw){let u;try{u=new URL(raw)}catch{return null}
  if(u.protocol!=="https:")return null;
  const h=u.hostname.replace(/^(www|m)\./,""),p=u.pathname.split("/").filter(Boolean),q=u.searchParams;let id;
  if(h==="youtu.be")id=p[0];
  else if(/^youtube(-nocookie)?\.com$/.test(h))id=p[0]==="watch"?q.get("v"):["shorts","live","embed","v"].includes(p[0])?p[1]:null;
  if(id&&/^[\w-]{11}$/.test(id))return{id,embed:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`,thumb:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`,watch:`https://www.youtube.com/watch?v=${id}`};
  if(h==="twitch.tv"&&p[0]==="videos"&&/^\d+$/.test(p[1]||""))return{embed:`https://player.twitch.tv/?video=v${p[1]}&parent=${HOST}&autoplay=true`,watch:u.href};
  const slug=h==="clips.twitch.tv"?p[0]:(h==="twitch.tv"&&p[1]==="clip"?p[2]:null);
  if(slug&&/^[\w-]{5,100}$/.test(slug))return{embed:`https://clips.twitch.tv/embed?clip=${slug}&parent=${HOST}&autoplay=true`,watch:u.href};
  if(h==="vimeo.com"&&/^\d+$/.test(p[0]||""))return{embed:`https://player.vimeo.com/video/${p[0]}?autoplay=1`,watch:u.href};
  const dm=h==="dailymotion.com"&&p[0]==="video"?p[1]:(h==="dai.ly"?p[0]:null);
  if(dm&&/^[a-z0-9]+$/i.test(dm))return{embed:`https://www.dailymotion.com/embed/video/${dm}?autoplay=1`,thumb:`https://www.dailymotion.com/thumbnail/video/${dm}`,watch:u.href};
  return null}

function frame(src){const f=document.createElement("iframe");
  f.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-presentation");
  f.allow="autoplay; fullscreen; picture-in-picture; encrypted-media";f.allowFullscreen=true;
  f.referrerPolicy="strict-origin-when-cross-origin";f.title="Lecteur ABYSZ TV";f.src=src;return f}

/* ---------- Détection des lives ---------- */
const get=async u=>{const r=await fetch(u,{referrerPolicy:"no-referrer"});if(!r.ok)throw 0;return(await r.text()).trim()};
async function chkTwitch(c){try{const up=await get(`https://decapi.me/twitch/uptime/${c.id}`);
  if(/is offline/i.test(up))return{live:false};
  if(!/^\d+\s+(second|minute|hour|day)/i.test(up))return null;
  const [t,g,v]=await Promise.allSettled(["title","game","viewercount"].map(k=>get(`https://decapi.me/twitch/${k}/${c.id}`)));
  const ok=r=>r.status==="fulfilled"?clean(r.value,120):"";
  return{live:true,up,title:ok(t),game:ok(g),viewers:ok(v)}}catch{return null}}
async function chkYT(c){if(!S.key)return null;try{const b="https://www.googleapis.com/youtube/v3/";
  const pl=await(await fetch(`${b}playlistItems?part=contentDetails&maxResults=5&playlistId=UU${c.id.slice(2)}&key=${S.key}`)).json();
  const ids=(pl.items||[]).map(i=>i.contentDetails.videoId).join(",");if(!ids)return{live:false};
  const v=await(await fetch(`${b}videos?part=snippet&id=${ids}&key=${S.key}`)).json();
  const x=(v.items||[]).find(i=>i.snippet.liveBroadcastContent==="live");
  return x?{live:true,vid:x.id,title:clean(x.snippet.title,120)}:{live:false}}catch{return null}}

async function poll(){const prev=S.live[S.sel]?.live;
  const res=await Promise.all(S.ch.map(c=>c.platform==="twitch"?chkTwitch(c):c.platform==="youtube"?chkYT(c):null));
  S.live={};res.forEach((r,i)=>{if(r)S.live[i]=r});
  renderRail();renderBadge();
  const first=S.ch.findIndex((_,i)=>S.live[i]?.live);
  if(!S.manual&&first>=0&&first!==S.sel){S.sel=first;renderRail();show()}
  else if(!prev&&S.live[S.sel]?.live)show();
  else if(!$("#stage iframe")&&!$("#screen").hidden&&S.live[S.sel]===undefined)show();
  renderInfo()}

/* ---------- Rendu ---------- */
function renderBadge(){const on=S.ch.filter((_,i)=>S.live[i]?.live),b=$("#badge");b.replaceChildren();
  if(on.length){b.className="badge on";b.append(el("span","dot"),el("span","",`EN DIRECT · ${on.map(c=>c.name).join(", ")}`))}
  else{b.className="badge";b.textContent="● AUCUN LIVE POUR LE MOMENT"}}
function renderRail(){const r=$("#rail");r.replaceChildren();
  S.ch.forEach((c,i)=>{const b=el("button","tab"+(i===S.sel?" act":""));b.append(el("span","",ICON[c.platform]),el("span","",c.name));
    if(S.live[i]?.live)b.append(el("span","dot"));
    b.addEventListener("click",()=>{S.sel=i;S.manual=true;renderRail();show()});
    const x=el("button","x","✕");x.addEventListener("click",e=>{e.stopPropagation();if(isAdmin()&&confirm("Supprimer cette chaîne ?")){S.ch.splice(i,1);S.sel=0;save()}});b.append(x);r.append(b)})}
function renderInfo(){const s=S.live[S.sel];$("#i-t").textContent=s?.live?[s.title,s.game].filter(Boolean).join(" · "):"";$("#i-v").textContent=s?.live&&s.viewers?`👁 ${s.viewers} spectateurs`:""}
function screen(ic,h,p,link,label,vids){$("#stage iframe")?.remove();$("#screen").hidden=false;
  $("#s-ic").textContent=ic;$("#s-h").textContent=h;$("#s-p").textContent=p;
  const a=$("#s-a");a.hidden=!link;if(link){a.href=link;a.textContent=label}$("#s-b").hidden=!vids}
function show(){const c=S.ch[S.sel],st=S.live[S.sel];$("#stage iframe")?.remove();$("#screen").hidden=true;renderInfo();
  if(!c)return screen("📡","Aucune chaîne","Ajoutez une chaîne depuis le mode admin.",null,"",true);
  const play=src=>$("#stage").append(frame(src));
  if(c.platform==="twitch"){st&&!st.live?screen("📡",`${c.name.toUpperCase()} EST HORS LIGNE`,"Le live démarrera automatiquement ici dès que la chaîne sera en direct. En attendant, regardez nos vidéos !",null,"",true):play(`https://player.twitch.tv/?channel=${c.id}&parent=${HOST}&autoplay=true&muted=true`)}
  else if(c.platform==="youtube"){st?.live?play(`https://www.youtube-nocookie.com/embed/${st.vid}?autoplay=1&mute=1&rel=0`):st?screen("🔴","AUCUN LIVE YOUTUBE","Pas de direct en cours pour le moment.",null,"",true):play(`https://www.youtube-nocookie.com/embed/live_stream?channel=${c.id}&autoplay=1&mute=1`)}
  else if(c.platform==="kick")play(`https://player.kick.com/${c.id}?autoplay=true&muted=true`);
  else if(c.platform==="tiktok")screen("🎵",`TIKTOK LIVE @${c.id}`,"TikTok n'autorise pas l'intégration des lives : rejoignez-nous directement sur l'app.",`https://www.tiktok.com/@${c.id}/live`,"🔴 Ouvrir TikTok Live ↗");
  else screen("⚡",c.name,"Accédez à la page via le lien ci-dessous.",c.url,"Ouvrir ↗")}

function renderVideos(){const tags=["TOUT",...new Set(S.vid.map(v=>v.tag))],ch=$("#chips");ch.replaceChildren();
  if(!tags.includes(S.tag))S.tag="TOUT";
  if(tags.length>2)tags.forEach(t=>{const b=el("button","chip"+(t===S.tag?" act":""),t);b.addEventListener("click",()=>{S.tag=t;renderVideos()});ch.append(b)});
  const g=$("#grid");g.replaceChildren();const adm=isAdmin();let n=0;
  S.vid.forEach((v,i)=>{if(S.tag!=="TOUT"&&v.tag!==S.tag)return;const pv=parseVideo(v.url);if(!pv&&!adm)return;
    const card=el("div","card"+(n++===0&&S.tag==="TOUT"?" big":""));card.tabIndex=0;
    const th=el("div","th");if(pv?.thumb){const im=el("img");im.loading="lazy";im.alt="";im.referrerPolicy="no-referrer";im.src=pv.thumb;th.append(im)}
    th.append(el("div","pl","▶"));const vi=el("div","vi");vi.append(el("div","vt",v.tag),el("div","vn",v.title||"Sans titre"));
    if(!pv)vi.append(el("div","warn","⚠ Lien non supporté (visible admin uniquement)"));
    const cc=el("div","cc");[["✏️",()=>editVid(i)],["🗑️",()=>{if(confirm("Supprimer cette vidéo ?")){S.vid.splice(i,1);save()}}]].forEach(([t,f])=>{const b=el("button","cb",t);b.addEventListener("click",e=>{e.stopPropagation();f()});cc.append(b)});
    card.append(cc,th,vi);if(pv){const go=()=>play(i);card.addEventListener("click",go);card.addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
    g.append(card)});
  if(!g.children.length)g.append(el("div","empty","📹 Aucune vidéo pour le moment."))}

function play(i){const v=S.vid[i],pv=parseVideo(v?.url);if(!pv)return;
  $("#p-t").textContent=v.title;$("#p-a").href=pv.watch;$("#p-body").replaceChildren(frame(pv.embed));open("m-p")}
function closeAll(){document.querySelectorAll(".modal.on").forEach(m=>m.classList.remove("on"));$("#p-body").replaceChildren()}

/* ---------- Admin ---------- */
function editVid(i){if(!isAdmin())return;S.edit=i;const v=S.vid[i]||{};
  $("#v-h").textContent=i<0?"➕ Ajouter une vidéo":"✏️ Modifier";$("#v-t").value=v.title||"";$("#v-g").value=v.tag||"";$("#v-u").value=v.url||"";open("m-v")}
$("#add-v").addEventListener("click",()=>editVid(-1));
$("#v-ok").addEventListener("click",()=>{if(!isAdmin())return;const v=cleanVid({title:$("#v-t").value,tag:$("#v-g").value,url:$("#v-u").value});
  if(!v.title||!parseVideo(v.url))return toast("Titre requis et lien YouTube / Twitch / Vimeo / Dailymotion valide","error");
  S.edit<0?S.vid.push(v):S.vid[S.edit]=v;if(S.vid.length>100)S.vid.length=100;closeAll();save()});
$("#add-ch").addEventListener("click",()=>{$("#c-name").value=$("#c-id").value="";open("m-ch")});
$("#c-pf").addEventListener("change",e=>$("#c-idl").textContent=e.target.value==="link"?"URL https://…":e.target.value==="youtube"?"ID de chaîne (UC…)":"Identifiant / pseudo");
$("#c-ok").addEventListener("click",()=>{if(!isAdmin())return;const p=$("#c-pf").value,v=$("#c-id").value.trim();
  const c=cleanCh(p==="link"?{platform:p,name:$("#c-name").value,url:v}:{platform:p,id:v.replace(/^@/,""),name:$("#c-name").value});
  if(!c)return toast("Identifiant ou lien invalide","error");if(S.ch.length>=20)return toast("Maximum 20 chaînes","error");
  S.ch.push(c);closeAll();save()});
$("#set-key").addEventListener("click",()=>{if(!isAdmin())return;const k=prompt("Clé API YouTube Data v3 (restreinte à ton domaine) — vide pour retirer :",S.key);
  if(k===null)return;if(k&&!/^[\w-]{30,60}$/.test(k.trim()))return toast("Clé invalide","error");S.key=k.trim();save()});

async function save(){if(!isAdmin())return toast("Accès refusé","error");
  try{await setDoc(doc(db,"tv_config","main"),{channels:S.ch,customVideos:S.vid,ytKey:S.key,twitchChannel:S.ch.find(c=>c.platform==="twitch")?.id||""});toast("Enregistré ✔","success")}
  catch(e){console.error(e);toast("Échec de l'enregistrement","error")}
  renderRail();renderVideos();show();poll()}

/* ---------- Auth ---------- */
let fails=0,lock=0,idle;
const resetIdle=()=>{clearTimeout(idle);if(auth.currentUser)idle=setTimeout(()=>{signOut(auth);toast("Session admin expirée")},30*60*1000)};
["click","keydown"].forEach(e=>addEventListener(e,resetIdle,{passive:true}));
onAuthStateChanged(auth,u=>{const a=u?.email===ADMIN;if(u&&!a)signOut(auth);
  document.body.classList.toggle("admin",a);$("#adm-tag").hidden=!a;$("#add-v").hidden=!a;
  $("#auth-btn").textContent=a?"👤 Déconnexion":"👤 Admin";resetIdle();renderVideos()});
$("#auth-btn").addEventListener("click",()=>auth.currentUser?signOut(auth):open("m-auth"));
$("#a-ok").addEventListener("click",async()=>{if(Date.now()<lock)return toast("Trop de tentatives, patientez 1 minute","error");
  try{await signInWithEmailAndPassword(auth,$("#a-mail").value.trim(),$("#a-pw").value);fails=0;closeAll();toast("Session admin ouverte","success")}
  catch{if(++fails>=5){lock=Date.now()+60000;fails=0}toast("Identifiants incorrects","error")}
  $("#a-pw").value=""});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeAll));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeAll()}));
addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
$("#s-b").addEventListener("click",()=>$("#videos").scrollIntoView({behavior:"smooth"}));

/* ---------- Démarrage ---------- */
(async()=>{try{const s=await getDoc(doc(db,"tv_config","main"));
  if(s.exists()){const d=s.data();
    const raw=Array.isArray(d.channels)?d.channels:[{platform:"twitch",id:d.twitchChannel||"abysz_o",name:"Twitch"},{platform:"tiktok",id:"abysz_o",name:"TikTok"},...(Array.isArray(d.customTabs)?d.customTabs:[]).map(t=>({platform:"link",name:t.name,url:t.url}))];
    S.ch=raw.slice(0,20).map(cleanCh).filter(Boolean);
    S.vid=(Array.isArray(d.customVideos)?d.customVideos:[]).slice(0,100).map(cleanVid);
    S.key=/^[\w-]{30,60}$/.test(d.ytKey||"")?d.ytKey:""}}
  catch(e){console.error(e)}
  renderRail();renderVideos();await poll();show();setInterval(poll,60000)})();
</script>
</body>
</html>
